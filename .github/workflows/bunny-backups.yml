# Inspect (default) or change the backup, stats-key and data-source key settings on the Bunny app.
# Run by hand: Actions > Bunny settings > Run workflow. The logs are public, so the
# script prints names and yes/no facts only, never values.
name: Bunny settings

on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect (read-only), snapshots (read-only report backups), apply / create-and-apply (backup variables), stats-key (new private stats key), source-keys (Google Flood Hub key, ReliefWeb appname, Gemini key and PODCAST_ENABLED for the audio bulletins, and WhatsApp settings from this environment's secrets)
        required: true
        default: inspect
        type: choice
        options: [inspect, snapshots, apply, create-and-apply, stats-key, source-keys]
      zone:
        description: Name of the private backup storage zone
        required: true
        default: el-nino-watch-backups

permissions:
  contents: read

jobs:
  backups:
    runs-on: ubuntu-latest
    # Every run waits for the owner's approval (Settings > Environments > bunny-settings),
    # and only runs from main: some modes change the live app's settings.
    environment: bunny-settings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node .github/scripts/bunny-backups.mjs "${{ inputs.mode }}"
        env:
          BUNNYNET_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          BUNNY_APP_ID: ${{ vars.BUNNY_APP_ID }}
          BUNNY_CONTAINER: ${{ vars.BUNNY_CONTAINER || 'el-nino-watch' }}
          BACKUP_ZONE: ${{ inputs.zone }}
          GOOGLE_FLOOD_API_KEY: ${{ secrets.GOOGLE_FLOOD_API_KEY }}
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PODCAST_ENABLED: ${{ secrets.PODCAST_ENABLED }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          WHATSAPP_TEMPLATE_SO_LANGUAGE: ${{ secrets.WHATSAPP_TEMPLATE_SO_LANGUAGE }}
